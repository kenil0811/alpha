[project]
name = "alpha-sdk"
version = "0.1.0"
description = "Alpha App SDK: the only interface generated App/Task code uses (ctx.records, ctx.artifacts, ctx.models). Standard library only; no Core imports."
requires-python = "==3.13.9"
dependencies = []

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpha_sdk"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "**/*.py" }]
