[project]
name = "alpha-core"
version = "0.1.0"
description = "Alpha trusted Core: loopback transport, control store, run coordinator, worker supervision."
requires-python = "==3.13.9"
dependencies = [
    "alpha-contracts",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
]

[project.scripts]
alpha-core = "alpha.main:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpha"]
