contract_version: "0.2"
app_id: "my-food-diary-8d1599"
name: "My Food Diary"
description: "Log what you ate and how much, see today's calories, look back at any past day and watch your eating trends."
runtime_profile: "pyprof-391f9ca6e9db5bc54576"
sdk_version: "0.1.0"
capabilities: [records, models, artifacts]

collections:
  - name: food_entries
    description: "The diary itself: one record per thing I ate, so totals, history and trends can be built from it."
    fields:
      - {name: eaten_at, kind: datetime, required: true}
      - {name: eaten_on, kind: date, required: true}
      - {name: food, kind: text, required: true, max_length: 300}
      - {name: amount, kind: text, required: true, max_length: 120}
      - {name: quantity, kind: number, minimum: 0, maximum: 1000}
      - {name: unit, kind: choice, choices: [piece, slice, bowl, plate, cup, glass, serving, gram, millilitre, tablespoon, teaspoon]}
      - {name: meal, kind: choice, required: true, choices: [breakfast, lunch, dinner, snack]}
      - {name: calories, kind: number, required: true, minimum: 0, maximum: 20000}
      - {name: calories_are_an_estimate, kind: boolean, required: true}
      - {name: estimate_basis, kind: text, max_length: 240}
      - {name: note, kind: text, max_length: 500}
    indexes: [[eaten_on], [food]]

  - name: my_usual_foods
    description: "Foods I eat often with a known calorie figure per portion, so repeat logging is one tap and consistent."
    fields:
      - {name: food, kind: text, required: true, max_length: 200}
      - {name: portion, kind: text, required: true, max_length: 120}
      - {name: calories_per_portion, kind: number, required: true, minimum: 0, maximum: 20000}
      - {name: times_logged, kind: number, minimum: 0, maximum: 1000000}
    unique: [[food]]

  - name: my_settings
    description: "Optional preferences such as a daily calorie target, left empty until I set one."
    fields:
      - {name: daily_calorie_target, kind: number, minimum: 0, maximum: 20000}
      - {name: week_starts_on, kind: choice, choices: [monday, sunday]}

actions:
  - id: log_food
    title: Log what I ate
    description: "Save one thing I ate with its amount and meal, using my usual food's calories when it matches and an estimate otherwise, and give back the day's new total."
    handler: app_code.handlers:log_food
    invocable_from: [ui, manual, assistant]
    effect_class: local_write
    capability_requirements: [records, models]
    timeout_seconds: 120
    input_schema:
      type: object
      required: [food, amount, meal]
      additionalProperties: false
      properties:
        food: {type: string, minLength: 1, maxLength: 300}
        amount: {type: string, minLength: 1, maxLength: 120}
        meal: {type: string, enum: [breakfast, lunch, dinner, snack]}
        eaten_at: {type: [string, "null"]}
        calories: {type: [number, "null"], minimum: 0, maximum: 20000}
        quantity: {type: [number, "null"], minimum: 0, maximum: 1000}
        unit: {type: [string, "null"]}
        note: {type: [string, "null"], maxLength: 500}
    output_schema:
      type: object
      required: [id, revision]
      properties:
        id: {type: string}
        revision: {type: integer}
        food: {type: string}
        amount: {type: string}
        meal: {type: string}
        eaten_at: {type: string}
        date: {type: string}
        calories: {type: number}
        calories_are_an_estimate: {type: boolean}
        estimate_basis: {type: [string, "null"]}
        from_usual_food: {type: boolean}
        day_total: {type: number}
        day_entry_count: {type: integer}

  - id: estimate_calories
    title: Estimate calories
    description: "From a food description and amount, give a calorie figure plus a one-line basis, always as an estimate I can overwrite."
    handler: app_code.handlers:estimate_calories
    invocable_from: [ui, manual, assistant]
    effect_class: external_read
    capability_requirements: [records, models]
    timeout_seconds: 120
    input_schema:
      type: object
      required: [food]
      additionalProperties: false
      properties:
        food: {type: string, minLength: 1, maxLength: 300}
        amount: {type: [string, "null"], maxLength: 120}
        quantity: {type: [number, "null"], minimum: 0, maximum: 1000}
        unit: {type: [string, "null"]}
    output_schema:
      type: object
      required: [calories, basis, calories_are_an_estimate]
      properties:
        calories: {type: number}
        basis: {type: string}
        calories_are_an_estimate: {type: boolean}
        from_usual_food: {type: boolean}

  - id: correct_entry
    title: Correct or remove an entry
    description: "Change the food, amount, meal or calories of an entry I already logged, or remove it; my own calorie figure replaces the estimate and can be kept as a usual food."
    handler: app_code.handlers:correct_entry
    invocable_from: [ui, manual, assistant]
    effect_class: local_write
    capability_requirements: [records]
    timeout_seconds: 30
    input_schema:
      type: object
      required: [entry_id]
      additionalProperties: false
      properties:
        entry_id: {type: string, minLength: 1}
        expected_revision: {type: [integer, "null"]}
        food: {type: [string, "null"], maxLength: 300}
        amount: {type: [string, "null"], maxLength: 120}
        meal: {type: [string, "null"], enum: [breakfast, lunch, dinner, snack, null]}
        calories: {type: [number, "null"], minimum: 0, maximum: 20000}
        note: {type: [string, "null"], maxLength: 500}
        remove: {type: [boolean, "null"]}
        save_as_usual_food: {type: [boolean, "null"]}
        portion: {type: [string, "null"], maxLength: 120}
    output_schema:
      type: object
      required: [entry_id, removed]
      properties:
        entry_id: {type: string}
        removed: {type: boolean}
        id: {type: [string, "null"]}
        revision: {type: [integer, "null"]}
        food: {type: [string, "null"]}
        amount: {type: [string, "null"]}
        meal: {type: [string, "null"]}
        calories: {type: [number, "null"]}
        calories_are_an_estimate: {type: [boolean, "null"]}
        date: {type: string}
        day_total: {type: number}
        day_entry_count: {type: integer}
        usual_food: {type: [object, "null"]}
        can_save_as_usual_food: {type: boolean}

  - id: day_summary
    title: Summarise one day
    description: "For a chosen date, list the entries grouped by meal with the day's total, and the difference from my daily target when I have set one."
    handler: app_code.handlers:day_summary
    invocable_from: [ui, manual, assistant]
    effect_class: none
    capability_requirements: [records]
    timeout_seconds: 30
    input_schema:
      type: object
      required: []
      additionalProperties: false
      properties:
        date: {type: [string, "null"]}
        daily_calorie_target: {type: [number, "null"], minimum: 0, maximum: 20000}
    output_schema:
      type: object
      required: [date, day_total, entry_count, meals, has_target]
      properties:
        date: {type: string}
        day_total: {type: number}
        entry_count: {type: integer}
        estimated_entry_count: {type: integer}
        has_target: {type: boolean}
        daily_calorie_target: {type: [number, "null"]}
        difference_from_target: {type: [number, "null"]}
        target_note: {type: [string, "null"]}
        meals: {type: array}

  - id: trends
    title: Show my eating trends
    description: "Over a chosen period, work out daily totals, the 7-day rolling average and its direction, the average meal split and my most logged foods, and save them as a summary file when asked."
    handler: app_code.handlers:trends
    invocable_from: [ui, manual, assistant]
    effect_class: local_write
    capability_requirements: [records, artifacts]
    timeout_seconds: 60
    input_schema:
      type: object
      required: []
      additionalProperties: false
      properties:
        period: {type: [string, "null"]}
        save_summary_file: {type: [boolean, "null"]}
    output_schema:
      type: object
      required: [period, from_date, to_date, day_count, entry_count, daily_totals, direction]
      properties:
        period: {type: string}
        from_date: {type: string}
        to_date: {type: string}
        day_count: {type: integer}
        entry_count: {type: integer}
        days_logged: {type: integer}
        average_daily_calories: {type: [number, "null"]}
        rolling_average_latest: {type: [number, "null"]}
        rolling_average_previous: {type: [number, "null"]}
        rolling_average_change: {type: [number, "null"]}
        direction: {type: string}
        direction_note: {type: string}
        daily_totals: {type: array}
        rolling_average: {type: array}
        meal_split: {type: array}
        top_foods: {type: array}
        summary_file: {type: [object, "null"]}

  - id: save_settings
    title: Save my daily calorie target
    description: "Set or clear the optional daily calorie target and which day my week starts on."
    handler: app_code.handlers:save_settings
    invocable_from: [ui, manual, assistant]
    effect_class: local_write
    capability_requirements: [records]
    timeout_seconds: 30
    input_schema:
      type: object
      required: []
      additionalProperties: false
      properties:
        daily_calorie_target: {type: [number, "null"], minimum: 0, maximum: 20000}
        week_starts_on: {type: [string, "null"], enum: [monday, sunday, null]}
        clear_target: {type: [boolean, "null"]}
    output_schema:
      type: object
      required: [id, revision]
      properties:
        id: {type: string}
        revision: {type: integer}
        daily_calorie_target: {type: [number, "null"]}
        week_starts_on: {type: [string, "null"]}
        has_target: {type: boolean}

ui:
  entry: ui/src/main.tsx
  build_profile: "uiprof-5a3bad2e0741affeb06b"
  kit_version: "0.1.0"
  bridge_version: "0.2.0"
  views:
    - id: food_entries.recent
      collection: food_entries
      fields: [eaten_at, eaten_on, food, amount, quantity, unit, meal, calories, calories_are_an_estimate, estimate_basis, note]
      filterable: [eaten_on, meal, food]
      sortable: [eaten_at, eaten_on, created_at]
      default_order: [{field: eaten_at, direction: desc}, {field: created_at, direction: desc}]
      max_limit: 100
    - id: my_usual_foods.all
      collection: my_usual_foods
      fields: [food, portion, calories_per_portion, times_logged]
      filterable: [food]
      sortable: [food, times_logged, created_at]
      default_order: [{field: times_logged, direction: desc}, {field: food, direction: asc}]
      max_limit: 50
    - id: my_settings.current
      collection: my_settings
      fields: [daily_calorie_target, week_starts_on]
      sortable: [created_at]
      default_order: [{field: created_at, direction: asc}]
      max_limit: 5
  actions: [log_food, correct_entry, day_summary, trends, save_settings]
