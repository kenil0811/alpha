[package]
name = "alpha-desktop"
version = "0.1.0"
description = "Alpha native host: window/tray lifecycle and supervised Core process."
edition = "2021"
rust-version = "1.98"

[lib]
name = "alpha_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
