[package]
name = "alpha-desktop"
version = "0.1.0"
description = "Alpha native host: window/tray lifecycle and supervised Core process."
edition = "2021"
rust-version = "1.98"

[lib]
name = "alpha_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon", "macos-private-api"] }
# Native "Add files or images" / "Add a folder" dialogs for the assistant composer's + menu.
# The official plugin, not the bare `rfd` crate (not already in the dependency tree either way):
# it ships its own JS binding and capability permissions, matching how every other native ability
# here (speech, push-to-talk) is already exposed as a typed command with its own scope. Pinned
# below 2.8 (npm's latest): 2.8 raised its own `tauri` requirement past the `=2.11.6` pinned here.
tauri-plugin-dialog = "=2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

# Push-to-talk (Fn hold): Fn is a modifier flag, not a key `tauri-plugin-global-shortcut` can
# register, so this drives a CGEventTap directly. Both crates are already in Cargo.lock
# (pulled transitively by tauri/wry), so this adds no new dependency tree.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
