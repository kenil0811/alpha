[project]
name = "alpha-app-worker"
version = "0.1.0"
description = "Alpha App worker entry point: resolves a sealed Version's handler and runs it with the SDK context. Runs only inside the managed App runtime profile."
requires-python = "==3.13.9"
dependencies = ["alpha-sdk==0.1.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpha_app_worker"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "**/*.py" }]
